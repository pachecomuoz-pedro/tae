# /etc/nginx/sites-available/tae — Nginx DEL SERVIDOR (no el del contenedor).
#
# Su único trabajo: recibir el tráfico de Internet, poner el HTTPS (Certbot
# agrega el bloque 443 a este archivo) y pasar todo al contenedor `web`,
# que sirve React y reenvía /api a Django. Ver web/nginx.conf.
#
# Cambia tae.tudominio.mx por tu dominio. Guía: docs/DESPLIEGUE.md, paso 8.

server {
    listen 80;
    server_name 31.97.103.118;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django necesita saber que la petición original fue HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mayor que el del contenedor (100 s) y que gunicorn (90 s).
        proxy_read_timeout 110s;
    }
}
