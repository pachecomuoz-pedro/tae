# /etc/nginx/sites-available/tae
# Cambia tae.tudominio.mx por tu dominio. Certbot agrega el bloque HTTPS.
# Guía: docs/DESPLIEGUE.md, paso 9.

server {
    listen 80;
    server_name tae.tudominio.mx;

    client_max_body_size 10m;

    # Frontend React compilado (web/dist copiado aquí).
    root /var/www/tae;
    index index.html;

    location / {
        # Las rutas de la aplicación las resuelve React en el navegador.
        try_files $uri /index.html;
    }

    # El index.html nunca se guarda en caché: así una versión nueva se ve
    # al recargar. Los archivos de /assets llevan huella en el nombre y sí.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API de Django. Mismo dominio que el frontend: la cookie de sesión
    # funciona sin configurar CORS.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mayor que el timeout de gunicorn (90 s): una venta lenta no se corta aquí.
        proxy_read_timeout 100s;
    }

    location /static/ {
        alias /opt/tae/staticfiles/;
        expires 7d;
    }
}
