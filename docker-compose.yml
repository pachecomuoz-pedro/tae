# Desarrollo y pruebas rápidas: todo en contenedores.
#
#   db       MySQL 8
#   cache    Redis 7
#   api      Django (runserver)            → http://localhost:8000/api
#   tareas   programador: catálogo diario y reintentos de ventas
#   web      React (Vite, recarga en vivo) → http://localhost:5173
#   correo   Mailpit: bandeja de correos de prueba → http://localhost:8025
#
#   docker compose up -d --build
#
# Producción usa deploy/docker-compose.prod.yml (gunicorn y Nginx).

services:
  db:
    image: mysql:8.0
    command: --default-storage-engine=INNODB --character-set-server=utf8mb4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - datos_mysql:/var/lib/mysql
      # Permiso para la base de pruebas (test_<nombre>); corre al crear el volumen.
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP (127.0.0.1) y no por socket: durante la primera inicialización
      # el servidor temporal solo escucha en el socket y daría "sano" antes de tiempo.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      retries: 20

  cache:
    image: redis:7-alpine

  api:
    build: .
    command: sh -c "python manage.py esperar_bd && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Tareas programadas: catálogo diario y reintentos de ventas sin resolver.
  # Hace las veces de crontab (Windows no tiene). Ver
  # apps/core/management/commands/programador.py.
  tareas:
    build: .
    command: sh -c "python manage.py esperar_bd && python manage.py programador"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: desarrollo
    environment:
      VITE_API_DESTINO: http://api:8000
      VITE_POLLING: "1"
    volumes:
      - ./web:/app
      # node_modules se queda el del contenedor (Linux), no el de Windows.
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  # Simulador de correo: atrapa todo lo que manda Django (recuperación de
  # contraseña, avisos) y lo muestra en http://localhost:8025. Nada sale a
  # internet. En .env: EMAIL_BACKEND smtp, EMAIL_HOST=correo, EMAIL_PORT=1025.
  correo:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  datos_mysql:
