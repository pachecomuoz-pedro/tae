# Nginx DENTRO del contenedor web (producción). Sirve el React compilado y
# pasa /api al contenedor de Django. El HTTPS no se hace aquí: lo hace el
# Nginx del servidor (deploy/nginx-tae.conf) con Certbot, y reenvía todo a
# este contenedor. Ver docs/DESPLIEGUE.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Las rutas de la aplicación las resuelve React en el navegador.
    location / {
        try_files $uri /index.html;
    }

    # index.html sin caché: una versión nueva se ve al recargar.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Los archivos de /assets llevan huella en el nombre: caché larga.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API de Django: mismo dominio que el frontend, así la cookie de sesión
    # funciona sin configurar CORS.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        # El Nginx del servidor ya dice si fue HTTPS; se respeta su valor.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Mayor que el timeout de gunicorn (90 s): una venta lenta no se corta aquí.
        proxy_read_timeout 100s;
    }

    # Estáticos de Django (los genera collectstatic en el volumen compartido).
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }
}
